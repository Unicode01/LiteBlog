<div id="card-container" card-id="{{id}}" class="card-container card-container-split-line" style="order:{{order}};
    width:100%;height:40px;margin:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div id="top-class" class="top-class" style="font-size:30px;
    color: #303030;
    height: 20px;
    width: 100%;
    box-sizing: border-box;
    margin-right:auto;
    padding: 0 10%;
    display: flex;
    justify-content: space-between;
    ">
        <div>{{card_title}}</div>
        <button id="stack-button" style="
            background-color: var(--base-gray-200);
            border: none;
            position: relative;
            transform: translateY(10px);
            width: 25px;
            height: 25px;
            display: flex;
            border-radius: 6px;
            font-weight: 500;
            font-size: 16px;
            justify-content: center;
            align-items: center;
            color: var(--base-black);
            cursor: pointer;
            padding: 0;
        " onclick="
        stackCard(document.querySelector('#card-container[card-id='+'\''+'{{id}}' +'\''+']'), null);
        ">≡</button>
    </div>
    <div id="bottom-line" class="bottom-line" style="height:20px;width:90%;box-shadow: 1px 1px 1px #888888;"></div>
</div>
