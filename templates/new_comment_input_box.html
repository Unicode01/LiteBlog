<div class="comment-input-box">
    <div class="input-group">
        <label for="add-comment-author">Author</label>
        <input type="text" id="add-comment-author" required>
        <label for="add-comment-emailaddress" class="email-label-container">
            <div class="email-label">Email Address</div>
            <input type="checkbox" title="Subscribe to receive email notifications when you receive new reply." class="email-subscribe-button"></input>
        </label>
        <input type="text" id="add-comment-emailaddress" required>
        <label for="add-comment-text">Comment</label>
        <textarea id="add-comment-text" rows="3" required></textarea>
    </div>

    <div id="comment-validator"></div>
    <div class="button-group">
        <button type="button" class="add-comment-button" onclick="OnAddCommentButtonClick()">Submit</button>
        <button type="button" class="cancel-button" onclick="CancelCommentInputBox()">Cancel</button>
    </div>
</div>
