<!DOCTYPE html>
<html lang="{{global:blog_language_code}}">

<head>
    <title>Login to LiteBlog</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    </link>
    <link rel="stylesheet" type="text/css" href="/css/login.css">
    </link>
    <link rel="stylesheet" type="text/css" href="/css/customizestyle.css">
    </link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to LiteBlog">
    <script>
        // Preload dark theme CSS
        function loadStyleString(css) {
            var style = document.createElement("style");
            style.type = "text/css";
            style.id = "preloaded-theme";
            try {
                style.appendChild(document.createTextNode(css));
            } catch (ex) {
                style.textContent = css;
            }
            var head = document.getElementsByTagName("head")[0];
            head.appendChild(style);
        }
        const Theme = localStorage.getItem('theme');
        // console.log(Theme);
        if (Theme == 'dark') {
            const css = localStorage.getItem('dark-theme-css');
            // console.log(css);
            loadStyleString(css)
        }
    </script>
</head>

<body>
    <div id="app">
        <div id="top-bar"
            class="top-bar display-flex justify-content-space-between align-items-center height-50px width-100">
            <div id="logo" class="logo display-flex align-items-center justify-content-center height-50px">
                <a href="/" class="link width-30px height-30px padding-10px user-select-none"><img src="/img/logo.webp"
                        class="logo img width-30px height-30px" alt="logo"></a>
                <span class="logo text padding-10px">{{global:TopBarTitle}}</span>
            </div>

            <div id="function-bar"
                class="function-bar display-flex align-items-center justify-content-center height-30px padding-10px">

                <a href="#switch-theme" id="switch-theme-button"
                    class="switch-theme-button button padding-10px width-30px height-30px user-select-none">
                    <img src="/img/switchTheme.svg" class="switch-theme-icon img width-30px height-30px"
                        alt="switch-theme">
                </a>

                <a href="/feed/rss.xml" id="rss-button" class="rss-button button padding-10px width-30px height-30px user-select-none">
                    <img src="/img/rss.webp" class="rss-icon img width-30px height-30px" alt="rss feed">
                </a>

            </div>
        </div>

        <div id="content-container"
            class="content-container width-100 height-100 display-flex justify-content-center flex-wrap">


            <div class="login-form-container">
                <div class="login-title">
                    <h2>Login to LiteBlog</h2>
                </div>
                <div class="login-form">
                    <div class="input-group">
                        <label for="access-path">Access Path</label>
                        <input type="text" id="access-path" name="access-path" placeholder="Access Path">
                    </div>
                    <div class="input-group">
                        <label for="acccess-token">Access Token</label>
                        <input type="password" id="access-token" name="access-token" placeholder="Access Token">
                    </div>
                    <div class="button-group">
                        <button id="login-button" class="button">Login</button>
                    </div>
                </div>

            </div>
            <div id="bottom-bar" class="bottom-bar display-flex flex-wrap justify-content-center height-50px width-100">
                {{file:bottom_bar}}
            </div>
        </div>

        <script src="/js/app.js"></script>
        <script src="/js/inject.js"></script>
        <script src="/js/editmode.js"></script>
        <script>
            document.getElementById("login-button").addEventListener("click", function () {
                let ThisServerIdentify = "{{rendered:token_encrypt_key}}";
                path = document.getElementById("access-path").value;
                token = document.getElementById("access-token").value;
                if (path == "" || token == "") {
                    window.Notify.alert("Please enter both Access Path and Access Token");
                } else {
                    // try login
                    LogInAPI(path, token, function (data) {
                        if (data === "") {
                            console.log("Login failed.");
                            window.Notify.alert("Login failed.");
                            return null;
                        }
                        localStorage.setItem("login_token", data.token);
                        localStorage.setItem("login_token_expire_time", data.timeout);
                        localStorage.setItem("access_path", path);
                        localStorage.setItem("server_identify", ThisServerIdentify);
                        window.Notify.add("Login successfully.", {
                            type: "success",
                            onRemove: function () {
                                params = new URLSearchParams(window.location.search);
                                redirect = params.get("redirect")
                                blank = params.get("blank") === "true";
                                if (blank) {
                                    window.opener = null;
                                    window.open("", "_self");
                                    window.close();
                                } else {
                                    if (redirect) {
                                        window.location.href = redirect;
                                    } else {
                                        window.location.href = "/";
                                    }
                                }

                            }
                        });
                    });
                }
            });
        </script>
</body>

</html>
